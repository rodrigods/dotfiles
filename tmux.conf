set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s terminal-features[100] 'xterm*:extkeys:RGB'
set -s terminal-features[101] 'iTerm*:extkeys:RGB'

# Key bindings
set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

bind r source-file ~/.tmux.conf
bind w choose-tree -Zw -F ' #{?#{==:#{n:window_index},1}, ,}#{?window_activity_flag,● ,  }#W '

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

bind '$' command-prompt -I "#S" { rename-session "%%" }
bind ',' command-prompt -I "#W" { rename-window "%%" }

# Catppuccin Macchiato
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#cad3f5,bg=#181926'
set -g status-left ' #S  '
set -g status-left-length 30
set -g status-left-style 'fg=#cad3f5,bg=#181926,bold'
set -g status-right '%H:%M '
set -g status-right-length 10
set -g status-right-style 'fg=#6e738d,bg=#181926'

set -g window-status-separator ''
set -g window-status-style 'fg=#a5adcb,bg=#181926'
set -g window-status-last-style 'fg=#a5adcb,bg=#181926'
set -g window-status-format ' #I:#W '
set -g window-status-current-style 'fg=#24273a,bg=#8aadf4,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-activity-style 'fg=#eed49f,bg=#181926,bold'

set -g pane-border-style 'fg=#363a4f'
set -g pane-active-border-style 'fg=#8aadf4'
set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g window-style 'fg=#8087a2,bg=#24273a'
set -g window-active-style 'fg=#cad3f5,bg=#181926'

set -g message-style 'fg=#24273a,bg=#eed49f,bold'
set -g message-command-style 'fg=#cad3f5,bg=#363a4f'
set -g display-panes-colour '#8087a2'
set -g display-panes-active-colour '#8aadf4'

setw -g mode-style 'fg=#24273a,bg=#8aadf4,bold'
setw -g menu-style 'fg=#cad3f5,bg=#1e2030'
setw -g menu-selected-style 'fg=#24273a,bg=#8aadf4,bold'
setw -g menu-border-style 'fg=#494d64'
setw -g popup-style 'fg=#cad3f5,bg=#1e2030'
setw -g popup-border-style 'fg=#494d64'
setw -g copy-mode-match-style 'fg=#24273a,bg=#eed49f'
setw -g copy-mode-current-match-style 'fg=#24273a,bg=#8aadf4'
setw -g copy-mode-mark-style 'fg=#24273a,bg=#c6a0f6'
setw -g clock-mode-colour '#8aadf4'

# Highlight activity without notifications
set -g visual-activity off
setw -g monitor-activity on
set -g bell-action none
setw -g monitor-bell off

set -g mouse on

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
